name: github
on: push
jobs:
  firstjob:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Execute remote SSH commands using SSH key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ SECRETS_HOST }}
          username: ${{ SECRETS_USERNAME }}
          key: ${{ SECRETS_KEY }}
        script: whoami
    

  
  
         
    
                    

